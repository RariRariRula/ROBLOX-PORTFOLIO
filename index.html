<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width,initial-scale=1">
	<title>Portfolio</title>
	<link rel="stylesheet" href="css/style.css">
	<meta name="color-scheme" content="light dark">
</head>
<body>
	<div id="sticky-nav" class="sticky-nav"></div>
	<div id="lightbox-modal" class="lightbox-modal"></div>

	<div id="banner" class="banner"></div>

	<header class="topbar">
		<div class="container">
			<div class="hero">
				<img id="hero-img" src="" alt="hero"/>
				<div>
					<h1 id="name">Your Name</h1>
					<p id="role">Your role</p>
				</div>
			</div>
			<div class="controls">
				<button id="theme-toggle">Theme</button>
			</div>
		</div>
	</header>

	<main class="container">
		<section id="about">
			<h2>About Me</h2>
			<p id="about-text"></p>
		</section>

		<section id="status">
			<h2>Commission Status</h2>
			<div id="commission-status"></div>
		</section>

		<section id="timeline">
			<h2>Timeline & Turnaround</h2>
			<div id="timeline-list" class="timeline"></div>
		</section>

		<section id="process">
			<h2>How It Works</h2>
			<div id="process-list" class="process"></div>
		</section>

		<section id="pricing">
			<h2>Pricing</h2>
			<div id="pricing-list"></div>
		</section>

		<section id="portfolio">
			<h2>Portfolio</h2>
			<div id="portfolio-list" class="portfolio-grid"></div>
		</section>

		<section id="testimonials">
			<h2>Testimonials</h2>
			<div id="testimonials-list" class="testimonials"></div>
		</section>

		<section id="news">
			<h2>Recent Updates</h2>
			<div id="news-list" class="news"></div>
		</section>

		<section id="videos">
			<h2>Video Showcase</h2>
			<div id="videos-list" class="videos-grid"></div>
		</section>

		<section id="gallery">
			<h2>Gallery</h2>
			<div id="gallery-list" class="gallery-grid"></div>
		</section>

		<section id="quote">
			<h2>Get Custom Quote</h2>
			<div id="quote-form"></div>
		</section>

		<section id="faq">
			<h2>FAQ</h2>
			<div id="faq-list"></div>
		</section>

		<section id="contact">
			<h2>Rules & Guidelines</h2>
			<div id="rules-list"></div>
			<h2 style="margin-top:24px">DM me to Order</h2>
			<div id="socials" class="chips"></div>
		</section>
	</main>

	<footer class="container">
		<small id="footer"></small>
	</footer>

	<script src="js/main.js"></script>
</body>
</html>
